[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "olha-casa"
version = "0.1.0"
description = "Monitor gratuito de arrendamento para o Telegram"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4==4.12.3",
  "PyYAML==6.0.2",
  "requests==2.32.3",
]

[project.optional-dependencies]
test = ["pytest==8.3.5"]

[project.scripts]
olha-casa = "olha_casa.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

