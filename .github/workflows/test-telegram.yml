name: Testar Telegram

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-telegram:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      OLHA_CASA_DRY_RUN: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar
        run: pip install .

      - name: Enviar alerta de teste
        run: |
          python - <<'PY'
          from datetime import UTC, datetime

          from olha_casa.config import load_config
          from olha_casa.message import format_alert
          from olha_casa.models import Listing, RentalTerms
          from olha_casa.telegram import TelegramSender

          listing = Listing(
              source="teste",
              source_id="exemplo",
              url="https://github.com/gabryellalee/olha-casa",
              title="TESTE — Apartamento T2 na Maia",
              price=700,
              area_m2=65,
              typology="T2",
              location="Maia",
              peak_drive_minutes=18,
              drive_estimate_kind="estimativa de teste",
              parking=None,
              first_seen_at=datetime.now(UTC).isoformat(),
              terms=RentalTerms(
                  deposits=1,
                  advance_rents=1,
                  entry_total=1400,
                  equipped_kitchen=True,
              ),
              missing=["elevador", "animais permitidos"],
          )

          sender = TelegramSender(load_config("config.example.yml"))
          sender.validate()
          sender.send("<b>🧪 TESTE — não é um anúncio real</b>\n\n" + format_alert(listing))
          PY

