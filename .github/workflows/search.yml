name: Procurar casas

on:
  schedule:
    # Aos minutos 7 e 37 para evitar o congestionamento habitual no início da hora.
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Simular sem enviar nem gravar estado"
        required: false
        type: boolean
        default: false
      send_current:
        description: "Enviar também os anúncios atuais que cumprem os critérios"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: olha-casa-search
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      OLHA_CASA_DRY_RUN: ${{ inputs.dry_run || 'false' }}
      OLHA_CASA_SEND_CURRENT: ${{ inputs.send_current || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            pip install ".[test]"
          else
            pip install .
          fi

      - name: Testar alterações
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: pytest -q

      - name: Procurar e enviar
        shell: bash
        run: |
          args=()
          if [ "$OLHA_CASA_SEND_CURRENT" = "true" ]; then
            args+=(--send-current)
          fi
          python -m olha_casa.main --config config.example.yml "${args[@]}"

      - name: Guardar histórico
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "olha-casa-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: atualizar histórico de anúncios [skip ci]"
            git push
          fi

