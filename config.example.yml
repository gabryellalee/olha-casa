project:
  timezone: Europe/Lisbon
  state_file: data/state.json
  report_file: run-report.json
  notify_existing_on_first_run: false

search:
  exceptional_max_rent: 750
  ideal_peak_drive_minutes: 20
  max_candidates_per_source: 18
  known_refresh_limit_per_source: 6
  request_delay_seconds: 1.2
  request_timeout_seconds: 12
  # Identificação transparente. Pode trocar o endereço pelo seu.
  user_agent: "OlhaCasa/0.1 (personal rental search; low-frequency)"

home_office:
  comfortable_t0_m2: 42
  comfortable_t1_m2: 45

geo:
  iscap:
    name: ISCAP
    address: "Rua Jaime Lopes Amorim, 4465-004 São Mamede de Infesta"
    latitude: 41.1829
    longitude: -8.6067
  # Aproximação do círculo enviado. Edite os vértices se quiser afinar a borda.
  allowed_polygon:
    - [-8.714, 41.155]
    - [-8.735, 41.205]
    - [-8.721, 41.265]
    - [-8.670, 41.325]
    - [-8.602, 41.351]
    - [-8.535, 41.342]
    - [-8.480, 41.307]
    - [-8.464, 41.250]
    - [-8.478, 41.198]
    - [-8.520, 41.158]
    - [-8.576, 41.134]
    - [-8.641, 41.130]
    - [-8.692, 41.143]
    - [-8.714, 41.155]
  # Usado apenas quando o anúncio não fornece coordenadas.
  fallback_allowed_places:
    - porto
    - matosinhos
    - maia
    - trofa
    - são mamede de infesta
    - senhora da hora
    - leça da palmeira
    - lavra
    - perafita
    - vilar do pinheiro
    - modivas
    - vila chã
    - mindelo
    - ermesinde
    - alfena
    - rio tinto
    - baguim do monte
    - vila nova de famalicão
    - paços de ferreira
  # Estes concelhos são aceites mesmo quando as coordenadas ficam fora do
  # polígono aproximado original.
  additional_allowed_places:
    - vila nova de famalicão
    - paços de ferreira
  fallback_excluded_places:
    - vila nova de gaia
    - póvoa de varzim

routing:
  # Serviço público sem chave. Só é consultado para anúncios novos com coordenadas.
  osrm_url: "https://router.project-osrm.org"
  peak_multiplier: 1.40
  approximate_location_multiplier: 1.15

sources:
  # Os URLs estão ordenados pelos anúncios mais recentes. Podem ser substituídos
  # por pesquisas guardadas nos portais, mantendo o mesmo domínio.
  - name: idealista
    enabled: true
    search_urls:
      - "https://www.idealista.pt/arrendar-casas/porto-distrito/?ordem=publicado-desc"
      - "https://www.idealista.pt/arrendar-casas/vila-nova-de-famalicao/?ordem=publicado-desc"
  - name: imovirtual
    enabled: true
    search_urls:
      - "https://www.imovirtual.com/pt/resultados/arrendar/apartamento/porto?by=LATEST&direction=DESC"
      - "https://www.imovirtual.com/pt/resultados/arrendar/t0/porto?by=LATEST&direction=DESC"
      - "https://www.imovirtual.com/pt/resultados/arrendar/moradia/porto?by=LATEST&direction=DESC"
      - "https://www.imovirtual.com/pt/resultados/arrendar/apartamento/braga/vila-nova-de-famalicao?by=LATEST&direction=DESC"
      - "https://www.imovirtual.com/pt/resultados/arrendar/t0/braga/vila-nova-de-famalicao?by=LATEST&direction=DESC"
      - "https://www.imovirtual.com/pt/resultados/arrendar/moradia/braga/vila-nova-de-famalicao?by=LATEST&direction=DESC"
  - name: supercasa
    enabled: true
    search_urls:
      - "https://supercasa.pt/arrendar-casas/porto-distrito/com-preco-max-750%2Cpublicado-ultima-semana"
      - "https://supercasa.pt/arrendar-casas/vila-nova-de-famalicao/com-preco-max-750%2Cpublicado-ultima-semana"
  - name: casa_sapo
    enabled: true
    search_urls:
      - "https://casa.sapo.pt/alugar-casas/distrito.porto/?gp=750&ordem=1"
      - "https://casa.sapo.pt/alugar-casas/vila-nova-de-famalicao/?gp=750&ordem=1"
  - name: olx
    enabled: true
    search_urls:
      - "https://www.olx.pt/imoveis/apartamento-casa-a-venda/apartamentos-arrenda/porto/?search%5Bfilter_float_price%3Ato%5D=750&search%5Border%5D=created_at%3Adesc"
      - "https://www.olx.pt/imoveis/casas-moradias-para-arrendar-vender/moradias-arrenda/porto/?search%5Bfilter_float_price%3Ato%5D=750&search%5Border%5D=created_at%3Adesc"
      - "https://www.olx.pt/imoveis/apartamento-casa-a-venda/apartamentos-arrenda/vilanovadefamalicao-vilanovadefamalicao/?search%5Bfilter_float_price%3Ato%5D=750&search%5Border%5D=created_at%3Adesc"
      - "https://www.olx.pt/imoveis/casas-moradias-para-arrendar-vender/moradias-arrenda/vilanovadefamalicao-vilanovadefamalicao/?search%5Bfilter_float_price%3Ato%5D=750&search%5Border%5D=created_at%3Adesc"
  - name: custojusto
    enabled: true
    search_urls:
      - "https://www.custojusto.pt/porto/imobiliario/apartamentos-arrendar?pe=750"
      - "https://www.custojusto.pt/porto/imobiliario/moradias-arrendar?pe=750"
      - "https://www.custojusto.pt/braga/vila-nova-de-famalicao/imobiliario/apartamentos-arrendar?pe=750"
      - "https://www.custojusto.pt/braga/vila-nova-de-famalicao/imobiliario/moradias-arrendar?pe=750"

telegram:
  # O token vem exclusivamente dos GitHub Secrets. O chat ID é opcional:
  # quando não existe, o bot procura o grupo pelo título nos updates recentes.
  bot_token_env: TELEGRAM_BOT_TOKEN
  chat_id_env: TELEGRAM_CHAT_ID
  group_title: "Alertas Casinhas"
  dry_run_env: OLHA_CASA_DRY_RUN

